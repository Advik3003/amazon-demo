# ============================================================
# Kibana Configuration - Amazon Demo
# ============================================================
server.name: amazon-demo-kibana
server.host: "0.0.0.0"
server.port: 5601

# Elasticsearch connection
elasticsearch.hosts: ["http://elasticsearch:9200"]
elasticsearch.requestTimeout: 30000

# Kibana App settings
kibana.index: ".kibana"

# Disable telemetry in dev
telemetry.enabled: false
telemetry.optIn: false

# Logging
logging.appenders.default.type: console
logging.appenders.default.layout.type: pattern
logging.appenders.default.layout.pattern: "[%date][%level][%logger] %message"
logging.root.level: warn

# Security (disabled for local dev - enable in production)
xpack.security.enabled: false
xpack.encryptedSavedObjects.encryptionKey: "amazon-demo-local-key-32chars-000"
