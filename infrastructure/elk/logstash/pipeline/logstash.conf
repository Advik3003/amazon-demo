# ============================================================
# Logstash Pipeline Configuration
# ============================================================
# ROLE: Central log aggregation gateway
#
# FLOW:
#   Spring Services (TCP:5000 JSON) ──→ [INPUT]
#   Beat agents    (TCP:5044)       ──→ [INPUT]
#   ↓
#   [FILTER] Parse, enrich, normalize
#   ↓
#   [OUTPUT] → Elasticsearch indices
#
# INDEX STRATEGY:
#   One index per service per day: amazondemo-{service}-{YYYY.MM.dd}
#   This allows:
#     - Per-service retention policies
#     - Per-service index lifecycle management (ILM)
#     - Efficient filtering in Kibana
#
# KIBANA DATA VIEWS:
#   amazondemo-*       → all services (cross-service search)
#   amazondemo-auth-*  → auth service only
#   amazondemo-order-* → order service only
# ============================================================

# ==================== INPUT ====================
input {

  # Receives JSON logs from Spring Boot services via LogstashTcpSocketAppender
  # Each log line is a complete JSON object (from logstash-logback-encoder)
  tcp {
    port => 5000
    codec => json_lines {
      charset => "UTF-8"
    }
    tags => ["tcp-json"]
  }

  # Receives logs from Filebeat agents (in Kubernetes/VM deployments)
  beats {
    port => 5044
    tags => ["beats"]
  }

}

# ==================== FILTER ====================
filter {

  # ---- Parse @timestamp from the JSON ----
  # logstash-logback-encoder sets @timestamp automatically
  # If missing, use Logstash's receive time
  if ![`@timestamp`] {
    mutate {
      add_field => { "@timestamp" => "%{+YYYY-MM-dd'T'HH:mm:ss.SSSZ}" }
    }
  }

  # ---- Normalize log level field ----
  # Different encoder versions may call it "level" or "log.level"
  if [level] {
    mutate {
      uppercase => ["level"]
    }
  }

  # ---- Parse stack traces ----
  if [stack_trace] {
    mutate {
      gsub => ["stack_trace", "\\n", "\n"]
    }
  }

  # ---- Remove internal Logstash fields not useful in Kibana ----
  mutate {
    remove_field => ["port", "host", "@version"]
  }

  # ---- Tag errors for alerting ----
  if [level] == "ERROR" {
    mutate {
      add_tag => ["error", "alert-candidate"]
    }
  }

  # ---- Tag slow requests (>2000ms) ----
  if [duration_ms] and [duration_ms] > 2000 {
    mutate {
      add_tag => ["slow-request"]
    }
  }

}

# ==================== OUTPUT ====================
output {

  # ---- Elasticsearch ----
  # One index per service per day for targeted queries
  elasticsearch {
    hosts     => ["${ELASTICSEARCH_HOST:elasticsearch}:${ELASTICSEARCH_PORT:9200}"]
    index     => "amazondemo-%{[service]:unknown}-%{+YYYY.MM.dd}"
    user      => "${ELASTICSEARCH_USER:}"
    password  => "${ELASTICSEARCH_PASSWORD:}"

    # ILM (Index Lifecycle Management) settings
    ilm_enabled         => false   # Enable when production Elasticsearch is set up
    ilm_rollover_alias  => "amazondemo"
    ilm_pattern         => "{now/d}-000001"
    ilm_policy          => "amazondemo-log-policy"
  }

  # ---- Debug output (disable in production by removing this block) ----
  # Uncomment to see parsed events in Logstash container logs:
  # stdout {
  #   codec => rubydebug
  # }
}
