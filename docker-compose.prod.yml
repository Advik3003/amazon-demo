version: '3.8'

# ============================================================
# PRODUCTION ENVIRONMENT - docker-compose.prod.yml
# ============================================================
# Simulated production configuration for demo purposes.
# In a real production deployment, use:
#   - Kubernetes (see k8s/ directory) instead of Docker Compose
#   - AWS RDS instead of postgres container
#   - AWS ElastiCache instead of redis container
#   - AWS MSK instead of kafka container
#   - AWS AmazonMQ instead of rabbitmq container
#   - MongoDB Atlas instead of mongo container
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file environments/.env.prod up -d
#
# Or use the helper script:
#   ./scripts/start-prod.sh
# ============================================================

networks:
  amazon-demo-network:
    driver: bridge
    name: amazon-demo-prod-network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  kafka_data:
  zookeeper_data:

services:

  postgres:
    container_name: amazon-demo-prod-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      POSTGRES_MULTIPLE_DATABASES: ${POSTGRES_MULTIPLE_DATABASES}
    restart: always
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  mongo:
    container_name: amazon-demo-prod-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-CHANGE_IN_PROD}
    restart: always

  redis:
    container_name: amazon-demo-prod-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-CHANGE_IN_PROD}
    restart: always

  kafka:
    container_name: amazon-demo-prod-kafka
    environment:
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 1073741824
    restart: always

  rabbitmq:
    container_name: amazon-demo-prod-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-amazon_demo}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-CHANGE_IN_PROD}
    restart: always

  config-server:
    container_name: amazon-demo-prod-config-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      JWT_SECRET: ${JWT_SECRET:-CHANGE_IN_PROD}
    restart: always

  discovery-server:
    container_name: amazon-demo-prod-discovery-server
    environment:
      SPRING_PROFILES_ACTIVE: prod
    restart: always

  api-gateway:
    container_name: amazon-demo-prod-api-gateway
    ports:
      - "${API_GATEWAY_PORT:-80}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-CHANGE_IN_PROD}
    restart: always
    deploy:
      resources:
        limits:
          memory: 512M

  auth-service:
    container_name: amazon-demo-prod-auth-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${AUTH_DB_URL:-jdbc:postgresql://postgres:5432/auth_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-CHANGE_IN_PROD}
    restart: always

  user-service:
    container_name: amazon-demo-prod-user-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${USER_DB_URL:-jdbc:postgresql://postgres:5432/user_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
    restart: always

  product-service:
    container_name: amazon-demo-prod-product-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${PRODUCT_DB_URL:-jdbc:postgresql://postgres:5432/product_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      SPRING_DATA_MONGODB_URI: ${MONGO_URI:-mongodb://admin:CHANGE@mongo:27017/product_read_db?authSource=admin}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
      AWS_ENABLED: ${AWS_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_S3_BUCKET: ${S3_BUCKET:-amazon-demo-prod}
    restart: always

  inventory-service:
    container_name: amazon-demo-prod-inventory-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${INVENTORY_DB_URL:-jdbc:postgresql://postgres:5432/inventory_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
    restart: always

  order-service:
    container_name: amazon-demo-prod-order-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${ORDER_DB_URL:-jdbc:postgresql://postgres:5432/order_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      SPRING_DATA_MONGODB_URI: ${MONGO_URI:-mongodb://admin:CHANGE@mongo:27017/order_read_db?authSource=admin}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-amazon_demo}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-CHANGE_IN_PROD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
      AWS_ENABLED: ${AWS_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
    restart: always

  payment-service:
    container_name: amazon-demo-prod-payment-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: ${PAYMENT_DB_URL:-jdbc:postgresql://postgres:5432/payment_db}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-CHANGE_IN_PROD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:-CHANGE_IN_PROD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-amazon_demo}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-CHANGE_IN_PROD}
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
      PAYMENT_GATEWAY_URL: ${PAYMENT_GATEWAY_URL}
      PAYMENT_API_KEY: ${PAYMENT_API_KEY}
    restart: always

  notification-service:
    container_name: amazon-demo-prod-notification-service
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATA_MONGODB_URI: ${MONGO_URI:-mongodb://admin:CHANGE@mongo:27017/notification_db?authSource=admin}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-amazon_demo}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-CHANGE_IN_PROD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://admin:admin123@discovery-server:8761/eureka/
      AWS_ENABLED: ${AWS_ENABLED:-true}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      SES_FROM_EMAIL: ${SES_FROM_EMAIL:-noreply@amazondemo.com}
    restart: always
