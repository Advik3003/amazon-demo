# Payment Service - PRODUCTION environment overrides
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://postgres:5432/payment_db}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate

# Dummy payment gateway config for demo prod
app:
  payment:
    gateway-url: ${PAYMENT_GATEWAY_URL:https://api.dummy-payment-gateway.com/v1}
    api-key: ${PAYMENT_API_KEY:dummy-prod-payment-api-key-replace-in-real-prod}
    timeout: 30000
    retry-attempts: 3
