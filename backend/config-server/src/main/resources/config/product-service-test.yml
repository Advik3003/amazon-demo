# Product Service - TEST environment overrides
spring:
  datasource:
    url: jdbc:h2:mem:product_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
  data:
    mongodb:
      uri: mongodb://localhost:27017/product_test_db  # TestContainers

app:
  cache:
    product-ttl: 1       # 1 second in tests
    category-ttl: 1
    search-ttl: 1
  features:
    s3-uploads: false
