# ============================================================
# PRODUCTION ENVIRONMENT - Simulated AWS (Demo Mode)
# ============================================================
# Active when: SPRING_PROFILES_ACTIVE=prod
# Infrastructure: Production-grade Docker Compose
# AWS services: Simulated with dummy/mock endpoints (DEMO project)
#
# NOTE: In a real production deployment, replace dummy values with:
# - Real AWS credentials via AWS Secrets Manager or IAM roles
# - Real RDS endpoints, ElastiCache, MSK (Managed Kafka)
# - Real domain names and SSL certificates
#
# For this DEMO project, we simulate production-like configs
# while keeping everything runnable locally.

spring:
  kafka:
    bootstrap-servers: kafka:29092
    producer:
      acks: all
      retries: 5
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 1
    consumer:
      auto-offset-reset: earliest
      isolation-level: read_committed

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}

  data:
    redis:
      host: redis
      port: 6379
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 20
          max-idle: 10
          min-idle: 5

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@discovery-server:8761/eureka/

# JWT - production uses environment variable for secret
app:
  jwt:
    secret: ${JWT_SECRET:prod-jwt-secret-amazondemo-REPLACE-IN-REAL-PROD-min-256-bits}
    access-token-expiry: 900000       # 15 minutes
    refresh-token-expiry: 86400000    # 1 day (shorter in prod)

  # AWS - dummy/simulated for demo. Replace with real AWS in actual prod.
  aws:
    enabled: true
    region: ${AWS_REGION:us-east-1}
    # For real prod: use IAM role or env vars AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY
    access-key: ${AWS_ACCESS_KEY_ID:AKIADUMMYPRODACCESSKEY}
    secret-key: ${AWS_SECRET_ACCESS_KEY:dummyProdSecretKeyForDemoProjectReplaceInRealProd}
    # endpoint is empty = real AWS endpoints
    endpoint: ""
    s3:
      bucket-name: ${S3_BUCKET:amazon-demo-prod}
      endpoint: ""
      path-style-access: false
      cdn-url: ${CDN_URL:https://cdn.amazondemo.com}
    sqs:
      endpoint: ""
      queue-url-prefix: "https://sqs.us-east-1.amazonaws.com/123456789012"
      order-notifications-queue: "amazon-demo-prod-order-notifications"
      payment-notifications-queue: "amazon-demo-prod-payment-notifications"
      inventory-alerts-queue: "amazon-demo-prod-inventory-alerts"
    sns:
      endpoint: ""
      topic-arn-prefix: "arn:aws:sns:us-east-1:123456789012"
      order-events-topic: "arn:aws:sns:us-east-1:123456789012:amazon-demo-prod-order-events"
    ses:
      enabled: true
      endpoint: ""
      from-email: ${SES_FROM_EMAIL:noreply@amazondemo.com}
      from-name: "Amazon Demo"
    secrets-manager:
      enabled: true
      endpoint: ""

  # All features enabled in prod
  features:
    email-notifications: true
    sms-notifications: true
    s3-uploads: true
    sqs-events: true
    sns-alerts: true

  branding:
    app-name: ${APP_NAME:Amazon Demo}
    company-name: ${COMPANY_NAME:Amazon Demo Inc.}
    support-email: ${SUPPORT_EMAIL:support@amazondemo.com}

# Production logging - structured JSON, no DEBUG
logging:
  level:
    com.amazondemo: INFO
    org.springframework.security: WARN
    org.springframework.web: WARN
    com.amazonaws: WARN
    software.amazon.awssdk: WARN
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd HH:mm:ss.SSS}","level":"%-5level","correlationId":"%X{correlationId}","service":"%X{serviceName}","logger":"%logger{36}","message":"%msg"}%n'
