# Product Service - LOCAL environment overrides
spring:
  datasource:
    url: jdbc:postgresql://postgres:5432/product_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  data:
    mongodb:
      uri: mongodb://admin:admin123@mongo:27017/product_read_db?authSource=admin

app:
  aws:
    s3:
      bucket-name: amazon-demo-local
      endpoint: ""   # disabled locally
  features:
    s3-uploads: false
