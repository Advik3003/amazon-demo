server:
  port: 8082

spring:
  application:
    name: user-service

  datasource:
    url: jdbc:postgresql://localhost:5432/user_db
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # AWS S3 (LocalStack for local dev) - for profile images
  cloud:
    aws:
      region:
        static: us-east-1
      credentials:
        access-key: test
        secret-key: test
      s3:
        endpoint: http://localhost:4566  # LocalStack endpoint

springdoc:
  api-docs:
    path: /user-service/api-docs
  swagger-ui:
    path: /user-service/swagger-ui.html

# S3 Bucket config
app:
  aws:
    s3:
      bucket-name: amazon-demo-uploads
      profile-images-prefix: profile-images/

logging:
  level:
    com.amazondemo.user: DEBUG
