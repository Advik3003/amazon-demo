spring:
  application:
    name: order-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false

server:
  port: 8085

spring.datasource:
  url: jdbc:postgresql://localhost:5432/order_db
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver

spring.jpa:
  hibernate:
    ddl-auto: update
  show-sql: false

spring.data.mongodb:
  uri: mongodb://localhost:27017/order_read_db

spring.data.redis:
  host: localhost
  port: 6379

spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: "com.amazondemo.*"
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

spring.rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /order-service/api-docs

# AWS - defaults (overridden by profile)
app:
  aws:
    enabled: false
    sqs:
      endpoint: ""
  features:
    sqs-events: false

logging:
  level:
    com.amazondemo.order: DEBUG
