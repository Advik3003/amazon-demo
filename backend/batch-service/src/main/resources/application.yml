spring:
  application:
    name: batch-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false

server:
  port: 8088

spring.datasource:
  url: jdbc:postgresql://localhost:5432/batch_db
  username: postgres
  password: postgres

spring.jpa:
  hibernate:
    ddl-auto: update

spring.batch:
  jdbc:
    initialize-schema: always
  job:
    enabled: false  # Don't auto-run jobs on startup

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  batch:
    order-report-cron: "0 0 1 * * ?"
    cleanup-cron: "0 0 2 * * ?"
