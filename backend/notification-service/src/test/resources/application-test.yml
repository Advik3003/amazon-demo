# Notification Service - Test Configuration
spring:
  config:
    import: ""
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:notif_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  mail:
    host: localhost
    port: 3025
    username: test
    password: test

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  aws:
    enabled: false
    ses:
      enabled: false

logging:
  level:
    com.amazondemo: DEBUG
