spring:
  application:
    name: notification-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false

server:
  port: 8087

spring.data.mongodb:
  uri: mongodb://localhost:27017/notification_db

spring.rabbitmq:
  host: localhost
  port: 5672
  username: guest
  password: guest

spring.kafka:
  bootstrap-servers: localhost:9092
  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: "com.amazondemo.*"

spring.mail:
  host: localhost
  port: 1025
  username: ""
  password: ""
  properties:
    mail:
      smtp:
        auth: false
        starttls:
          enable: false

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

springdoc:
  api-docs:
    path: /notification-service/api-docs

# AWS - defaults (disabled, overridden by profile)
app:
  notification:
    from-email: noreply@amazondemo.com
    from-name: "Amazon Demo"
  aws:
    enabled: false
    ses:
      enabled: false
    sqs:
      endpoint: ""
  features:
    email-notifications: false
    sqs-events: false

logging:
  level:
    com.amazondemo.notification: DEBUG
