spring:
  application:
    name: auth-service
  # Load config from Config Server first, fall back to local if unavailable
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false

server:
  port: 8081

# Default (dev/local) values - overridden by Config Server per environment
spring.datasource:
  url: jdbc:postgresql://localhost:5432/auth_db
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver
  hikari:
    maximum-pool-size: 10
    minimum-idle: 5

spring.jpa:
  hibernate:
    ddl-auto: validate      # Flyway manages schema; Hibernate only validates
  show-sql: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect

spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true    # Safe for existing DBs without Flyway history
  baseline-version: 0
  validate-on-migrate: true
  out-of-order: false          # Strict ordering enforced

spring.data.redis:
  host: localhost
  port: 6379

springdoc:
  api-docs:
    path: /auth-service/api-docs
  swagger-ui:
    path: /auth-service/swagger-ui.html

logging:
  level:
    com.amazondemo.auth: DEBUG

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
