spring:
  application:
    name: auth-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false
      retry:
        max-attempts: 3

# Fallback config when Config Server is not available
server:
  port: 8081

spring.datasource:
  url: jdbc:postgresql://localhost:5432/auth_db
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver

spring.jpa:
  hibernate:
    ddl-auto: update
  show-sql: false
  properties:
    hibernate:
      dialect: org.hibernate.dialect.PostgreSQLDialect

spring.data.redis:
  host: localhost
  port: 6379

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: "amazondemo-super-secret-jwt-key-change-in-production-min-256-bits"
    access-token-expiry: 900000
    refresh-token-expiry: 604800000

springdoc:
  api-docs:
    path: /auth-service/api-docs
  swagger-ui:
    path: /swagger-ui.html
