# Auth Service - Test Configuration
# Used when SPRING_PROFILES_ACTIVE=test or during mvn test
spring:
  config:
    import: ""  # Disable Config Server in tests
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:auth_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    enabled: false    # Flyway disabled in tests - H2 uses ddl-auto
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    enabled: false
    register-with-eureka: false
    fetch-registry: false

app:
  jwt:
    secret: "test-jwt-secret-key-for-unit-tests-min-256-bits-length-required"
    access-token-expiry: 60000
    refresh-token-expiry: 300000
  aws:
    enabled: false

logging:
  level:
    com.amazondemo: DEBUG
    org.springframework.security: WARN
