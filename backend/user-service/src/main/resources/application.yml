spring:
  application:
    name: user-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false

server:
  port: 8082

spring.datasource:
  url: jdbc:postgresql://localhost:5432/user_db
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver

spring.jpa:
  hibernate:
    ddl-auto: validate
  show-sql: false

spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
  baseline-version: 0
  validate-on-migrate: true

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
springdoc:
  api-docs:
    path: /user-service/api-docs
  swagger-ui:
    path: /swagger-ui.html

# Logstash connection (used by logback-spring.xml)
logstash:
  host: localhost
  port: 5000

