spring:
  application:
    name: product-service
  config:
    import: optional:configserver:http://localhost:8888
  cloud:
    config:
      fail-fast: false

server:
  port: 8083

spring.datasource:
  url: jdbc:postgresql://localhost:5432/product_db
  username: postgres
  password: postgres
  driver-class-name: org.postgresql.Driver

spring.jpa:
  hibernate:
    ddl-auto: update
  show-sql: false

spring.data.mongodb:
  uri: mongodb://localhost:27017/product_read_db
  auto-index-creation: true

spring.data.redis:
  host: localhost
  port: 6379

spring.kafka:
  bootstrap-servers: localhost:9092
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  consumer:
    key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
    auto-offset-reset: earliest
    properties:
      spring.json.trusted.packages: "com.amazondemo.*,java.util.*"

eureka:
  client:
    service-url:
      defaultZone: http://admin:admin123@localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: http://localhost:9411/api/v2/spans
springdoc:
  api-docs:
    path: /product-service/api-docs
  swagger-ui:
    path: /swagger-ui.html

# AWS - defaults (disabled, overridden by profile configs)
app:
  aws:
    enabled: false
    region: us-east-1
    s3:
      bucket-name: amazon-demo-local
      endpoint: ""
  cache:
    product-ttl: 300
    category-ttl: 3600
    search-ttl: 60
  kafka:
    topics:
      product-events: product-events
      inventory-events: inventory-events
  features:
    s3-uploads: false

logging:
  level:
    com.amazondemo.product: DEBUG

# Logstash connection (used by logback-spring.xml)
logstash:
  host: localhost
  port: 5000

