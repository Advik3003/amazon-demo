apiVersion: v1
kind: ConfigMap
metadata:
  name: amazon-demo-config
  namespace: amazon-demo
data:
  # Infrastructure service names (DNS in Kubernetes)
  POSTGRES_HOST: "postgres-service"
  MONGO_HOST: "mongo-service"
  REDIS_HOST: "redis-service"
  KAFKA_BOOTSTRAP_SERVERS: "kafka-service:9092"
  RABBITMQ_HOST: "rabbitmq-service"
  EUREKA_SERVER_URL: "http://admin:admin123@discovery-server-service:8761/eureka/"
  CONFIG_SERVER_URL: "http://config-server-service:8888"

  # Application config
  APP_JWT_SECRET: "amazondemo-super-secret-jwt-key-change-in-production-min-256-bits"
  APP_NAME: "Amazon Demo"
  ENVIRONMENT: "kubernetes"
---
apiVersion: v1
kind: Secret
metadata:
  name: amazon-demo-secrets
  namespace: amazon-demo
type: Opaque
stringData:
  # In production, use sealed-secrets or external secrets operator
  POSTGRES_PASSWORD: "postgres"
  MONGO_PASSWORD: "admin123"
  EUREKA_PASSWORD: "admin123"
  JWT_SECRET: "amazondemo-super-secret-jwt-key-change-in-production-min-256-bits"
